# /etc/nginx/nginx.conf
worker_processes  auto;
error_log  /var/log/nginx/error.log;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 11m;

        # Security headers (applied to all responses from this server)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;
        # TLS terminates upstream of this HTTP-only container. Configure HSTS at
        # that public TLS terminator so it is emitted only over HTTPS.

        # Serve the frontend app
        root /usr/share/nginx/html;
        index index.html;

        # Handle frontend routes
        location / {
            try_files $uri /index.html;
        }

        # The build emits content-hashed filenames under /static, so these are immutable.
        # add_header in a location resets inherited headers, hence the repetition.
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;
            try_files $uri =404;
        }

        # index.html is the entry point that names the hashed bundles - never cache it.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;
        }

        # Proxy API requests to the api compose service. Resolving through Docker's
        # DNS at request time lets nginx start (and recover) while api is down.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:5000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / "/";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
