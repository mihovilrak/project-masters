# /etc/nginx/nginx.conf
worker_processes  auto;
error_log  /var/log/nginx/error.log;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Keep the scheme the public TLS terminator saw; fall back to ours only when
    # nothing was forwarded.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Coarse backstop in front of the per-route limiters in the api.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # The build ships pre-compressed .gz next to each asset.
    gzip_static on;

    server {
        listen 8080;
        server_name localhost;
        client_max_body_size 11m;

        include /etc/nginx/snippets/security-headers.conf;
        # TLS terminates upstream of this HTTP-only container. Configure HSTS at
        # that public TLS terminator so it is emitted only over HTTPS.

        # Serve the frontend app
        root /usr/share/nginx/html;
        index index.html;

        # Container healthcheck target; never reaches the api.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Handle frontend routes
        location / {
            try_files $uri /index.html;
        }

        # The build emits content-hashed filenames under /static, so these are immutable.
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }

        # index.html is the entry point that names the hashed bundles - never cache it.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # File uploads stream straight through instead of being spooled to disk first.
        location /api/files/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_request_buffering off;
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # Proxy API requests to the api compose service.
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            include /etc/nginx/snippets/proxy-api.conf;
        }
    }
}
