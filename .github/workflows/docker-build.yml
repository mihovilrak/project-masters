name: Docker Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    # One job builds the image, smoke-tests the compose stack against that exact
    # image, and only then pushes it. Splitting the two made every push build
    # twice and left main and tag images untested.
    name: Build, Test and Push Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: pm:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pm:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Create .env for the test stack
        run: |
          set -euo pipefail
          {
            echo 'APP_IMAGE=pm:ci'
            echo 'POSTGRES_USER=pm_user'
            echo 'POSTGRES_DB=pm_db'
            echo 'POSTGRES_PASSWORD=ci_postgres_password'
            echo 'APP_DB_PASSWORD=ci_app_password'
            echo 'ADMIN_PASSWORD=ci_admin_password'
            echo 'TZ=UTC'
            echo 'NODE_ENV=production'
            echo 'FE_URL=http://localhost:3000'
            echo 'EMAIL_ENABLED=false'
            echo 'EMAIL_HOST=localhost'
            echo 'EMAIL_PORT=587'
            echo 'EMAIL_SECURE=false'
            echo 'EMAIL_USER=ci@example.com'
            echo 'EMAIL_PASSWORD=ci_email_password'
            echo 'EMAIL_FROM=CI <ci@example.com>'
            echo 'LOG_LEVEL=info'
            # Secrets the app refuses to start without; random per run.
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
          } > .env

      # The backup service runs as the nginx user (uid 101) from the app image.
      - name: Start services with Docker Compose
        run: |
          mkdir -p db/backup
          sudo chown 101:101 db/backup
          docker compose up -d

      - name: Wait for database to be ready
        run: |
          echo "Waiting for database to be ready..."
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U pm_user; do sleep 2; done'
          echo "Database is ready!"

      - name: Wait for application to be ready
        run: |
          set -euo pipefail
          echo "Waiting for application to start..."
          timeout 120 bash -c 'until curl -fsS http://localhost:3000/healthz > /dev/null; do sleep 3; done'
          echo "Application is ready!"

      - name: Verify services are running
        run: |
          set -euo pipefail
          echo "Checking service status..."
          docker compose ps

          echo "Testing frontend endpoint..."
          curl -fsS http://localhost:3000 > /dev/null

          # Unauthenticated session check must reach Express and answer 401,
          # not the SPA fallback that nginx serves for unknown paths.
          echo "Testing API routing..."
          session_status=$(curl -s -o /tmp/session.json -w '%{http_code}' http://localhost:3000/api/check-session)
          echo "GET /api/check-session -> $session_status"
          cat /tmp/session.json
          if [ "$session_status" != "401" ]; then
            echo "Expected 401 from /api/check-session, got $session_status"
            exit 1
          fi

          # Rejected login proves the API reached the database: a dead pool
          # surfaces as 500 from the error handler instead of 401.
          echo "Testing API database connectivity..."
          login_status=$(curl -s -o /tmp/login.json -w '%{http_code}' -X POST http://localhost:3000/api/login -H 'Content-Type: application/json' -d '{"login":"ci-smoke-test","password":"ci-smoke-test"}')
          echo "POST /api/login -> $login_status"
          cat /tmp/login.json
          if [ "$login_status" != "401" ]; then
            echo "Expected 401 from /api/login, got $login_status"
            exit 1
          fi

          echo "Testing backup..."
          docker compose exec -T backup sh /app/db/backup.sh
          # Verified inside the container: pg_restore needs a seekable file.
          docker compose exec -T backup sh -c 'pg_restore --list "/backups/$(ls -t /backups | head -1)"' > /dev/null

          echo "All services are running correctly!"

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=500 || true

      - name: Stop services
        # Runs even if an earlier step (e.g. the vulnerability scan) failed
        # before .env was created, so guard against compose erroring on the
        # missing required variables.
        if: always()
        run: '[ -f .env ] && docker compose down -v || true'

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs against the build cache the previous step populated, so this is
      # a push of the already-tested layers rather than a second build.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          platforms: linux/amd64
          provenance: true
          sbom: true
