name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_call:

env:
  NODE_VERSION: '25.x'

jobs:
  api-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --testPathIgnorePatterns='integration'
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/src/__tests__/coverage
          if-no-files-found: error

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: fe/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --runInBand
        env:
          CI: 'true'

      - name: Run performance tests
        run: yarn test:perf
        env:
          CI: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: fe/coverage
          if-no-files-found: error

  notification-service:
    name: Notification Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: notification-service/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Build TypeScript
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-coverage
          path: notification-service/coverage
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [api-tests]

    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_DB: pm_test
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: sh ../db/migrate.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pm_test
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
          APP_DB_USER: pm_app
          APP_DB_PASSWORD: pm_app_password

      # Unchanged files are skipped (only the migrate:always file re-runs),
      # and an edited file is re-applied with its new checksum recorded.
      - name: Re-run migrations
        run: |
          out=$(sh ../db/migrate.sh)
          echo "$out"
          echo "$out" | grep -qx 'Migrations applied: 1'

          file=411_DATA_tags.sql
          tmp=$(mktemp -d)
          cp -r ../db/init "$tmp/init"
          echo '-- ci re-run check' >> "$tmp/init/$file"
          out=$(INIT_DIR="$tmp/init" sh ../db/migrate.sh)
          echo "$out"
          echo "$out" | grep -qx 'Migrations applied: 2'
          expected=$(sha256sum "$tmp/init/$file" | cut -d ' ' -f 1)
          stored=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -X -At \
            -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -c "select checksum from schema_migrations where filename = '$file'")
          test "$stored" = "$expected"

          # Restore the original checksum, which migrations.test.ts checks.
          sh ../db/migrate.sh | grep -x 'Migrations applied: 2'
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: pm_test
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
          APP_DB_USER: pm_app
          APP_DB_PASSWORD: pm_app_password

      # The app connects as the non-superuser role, as in production.
      - name: Run integration tests
        run: yarn test:integration
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: pm_test
          TEST_DB_USER: pm_app
          TEST_DB_PASSWORD: pm_app_password
          TEST_DB_ADMIN_USER: pm_user
          TEST_DB_ADMIN_PASSWORD: pm_password
          SESSION_SECRET: test-session-secret
