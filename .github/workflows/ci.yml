name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_call:

env:
  NODE_VERSION: '25.x'

jobs:
  api-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --testPathIgnorePatterns='integration'
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/src/__tests__/coverage
          if-no-files-found: error

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: fe/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --runInBand
        env:
          CI: 'true'

      - name: Run performance tests
        run: yarn test:perf
        env:
          CI: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: fe/coverage
          if-no-files-found: error

  notification-service:
    name: Notification Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: notification-service/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Build TypeScript
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-coverage
          path: notification-service/coverage
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [api-tests]

    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_DB: pm_test
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: |
          set -euo pipefail
          for f in ../db/init/*.sql; do
            echo "Applying $f"
            PGPASSWORD=pm_password psql -v ON_ERROR_STOP=1 -h localhost -U pm_user -d pm_test -f "$f"
          done
        env:
          PGHOST: localhost
          PGPORT: 5432

      - name: Run integration tests
        run: yarn test:integration
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: pm_test
          TEST_DB_USER: pm_user
          TEST_DB_PASSWORD: pm_password
          SESSION_SECRET: test-session-secret
