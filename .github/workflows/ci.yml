name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  api-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --testPathIgnorePatterns='integration'
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: api/src/__tests__/coverage
          if-no-files-found: error

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: fe/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Run lint
        run: yarn lint

      - name: Run unit tests
        run: yarn test --coverage --maxWorkers=50%
        env:
          CI: 'true'

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: fe/coverage
          if-no-files-found: error

  notification-service:
    name: Notification Service Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: notification-service/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      # tsc here is the type check as well.
      - name: Build TypeScript
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-service-coverage
          path: notification-service/coverage
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_DB: pm_test
          POSTGRES_USER: pm_user
          POSTGRES_PASSWORD: pm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: pm_test
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password
      APP_DB_USER: pm_app
      APP_DB_PASSWORD: pm_app_password

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Initialize test database
        run: sh ../db/migrate.sh

      - name: Check migrations are re-runnable
        run: sh ../db/test/migrate-rerun.sh

      # The app connects as the non-superuser role, as in production.
      - name: Run integration tests
        run: yarn test:integration
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: pm_test
          TEST_DB_USER: pm_app
          TEST_DB_PASSWORD: pm_app_password
          TEST_DB_ADMIN_USER: pm_user
          TEST_DB_ADMIN_PASSWORD: pm_password
          SESSION_SECRET: test-session-secret
