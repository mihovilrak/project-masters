x-db: &db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

# The API and notification service connect as the non-superuser role that
# the migrate service creates; the superuser is only used by db, migrate and backup.
x-app-db: &app-db
  POSTGRES_HOST: db
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${APP_DB_USER:-pm_app}
  POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}

# Only the SMTP credentials stay in the environment; host, port, sender and the
# on/off switch are edited in the admin UI and stored in app_settings.
x-email: &email
  EMAIL_USER: ${EMAIL_USER}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD}

x-defaults: &defaults
  restart: unless-stopped
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1777

# APP_IMAGE defaults to the published image; the tag only exists once a matching
# v* git tag is pushed. Build locally with `docker compose build` (or
# `docker build -t project-node:dev .`) and set APP_IMAGE to use your own build.
x-app: &app
  <<: *defaults
  image: ${APP_IMAGE:-ghcr.io/mihovilrak/project-node:1.0.0}
  build: .
  user: nginx
  init: true

services:
  db:
    <<: *defaults
    image: postgres:18.1-alpine3.23
    user: postgres
    networks:
      - backend
    mem_limit: 512m
    cpus: 1.0
    environment:
      <<: *db
      PGTZ: ${TZ}
    volumes:
      - db_data:/var/lib/postgresql
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: applies db/init, (re)creates the app role and seeds the admin.
  migrate:
    <<: *app
    restart: "no"
    networks:
      - backend
    mem_limit: 256m
    command: ["/app/db/migrate.sh"]
    environment:
      <<: *db
      POSTGRES_HOST: db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASSWORD_FORCE_RESET: ${ADMIN_PASSWORD_FORCE_RESET:-false}
      APP_DB_USER: ${APP_DB_USER:-pm_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    networks:
      - backend
      - frontend
    mem_limit: 512m
    cpus: 1.0
    command: ["node", "/app/api/index.js"]
    environment:
      <<: [*app-db, *email]
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      FE_URL: ${FE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  notifications:
    <<: *app
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5
    command: ["node", "/app/service/index.js"]
    environment:
      <<: [*app-db, *email]
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ}
      FE_URL: ${FE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    healthcheck:
      # /ready gates on the database, /health on the cached SMTP probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/ready && wget -q -O /dev/null http://127.0.0.1:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    networks:
      - frontend
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:3000:8080"
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0750
    healthcheck:
      # nginx only: /api/health would mark web unhealthy whenever api is down.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  # Daily pg_dump at BACKUP_TIME (HH:MM, TZ) into ./db/backup on the host.
  backup:
    <<: *app
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.5
    entrypoint: ["sh", "/app/db/backup-scheduler.sh"]
    environment:
      <<: *db
      POSTGRES_HOST: db
      BACKUP_TIME: ${BACKUP_TIME:-00:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ}
    volumes:
      - ./db/backup:/backups
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  app_uploads:
  db_data:
